<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gifted - Offline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0ece0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .phone {
    width: 375px;
    height: 812px;
    background: #f0ece0;
    border-radius: 50px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.2), inset 0 0 0 2px #ccc;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 0;
    font-size: 15px;
    font-weight: 600;
  }
  .status-right {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  .battery {
    background: #4cd964;
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 5px;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 40px;
  }

  /* Cat floating animation */
  .cat-illustration {
    width: 160px;
    height: 160px;
    margin-bottom: 32px;
    animation: floatCat 3s ease-in-out infinite;
    transform-origin: center bottom;
  }
  @keyframes floatCat {
    0%   { transform: translateY(0px) rotate(0deg); }
    25%  { transform: translateY(-10px) rotate(-2deg); }
    50%  { transform: translateY(-14px) rotate(0deg); }
    75%  { transform: translateY(-8px) rotate(2deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }

  /* Blinking eyes */
  .eye-lid {
    animation: blink 4s ease-in-out infinite;
    transform-origin: center top;
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(0); }
    94%, 96%      { transform: scaleY(1); }
  }

  /* Tail wag */
  .cat-tail {
    animation: wagTail 1.2s ease-in-out infinite alternate;
    transform-origin: 0% 50%;
  }
  @keyframes wagTail {
    from { transform: rotate(-20deg); }
    to   { transform: rotate(20deg); }
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    color: #111;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    font-size: 16px;
    color: #999;
    text-align: center;
    margin-bottom: 32px;
  }

  /* Bouncy button */
  .btn-try {
    width: 100%;
    padding: 18px;
    background: #4a6cf7;
    color: white;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin-bottom: 20px;
    animation: bouncyPulse 2.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
    box-shadow: 0 6px 20px rgba(74,108,247,0.4);
  }
  @keyframes bouncyPulse {
    0%   { transform: scale(1);    box-shadow: 0 6px 20px rgba(74,108,247,0.4); }
    10%  { transform: scale(0.95); }
    20%  { transform: scale(1.05); }
    30%  { transform: scale(0.97); }
    40%  { transform: scale(1.02); }
    50%  { transform: scale(1);    }
    100% { transform: scale(1);    box-shadow: 0 6px 20px rgba(74,108,247,0.4); }
  }
  .btn-try:active {
    animation: none;
    transform: scale(0.93);
    transition: transform 0.1s;
  }

  .btn-close {
    background: none;
    border: none;
    color: #aaa;
    font-size: 16px;
    cursor: pointer;
  }
  .home-indicator {
    width: 134px;
    height: 5px;
    background: #333;
    border-radius: 3px;
    margin: 0 auto 10px;
    opacity: 0.3;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>16:29</span>
    <div class="status-right">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 3L3 21l1.41 1.42 3.38-3.39C9.22 20.29 10.58 21 12 21c3.73 0 7-2.91 7-6.5 0-1.98-.88-3.77-2.28-5L21 5V3z"/>
      </svg>
      <div class="battery">81⚡</div>
    </div>
  </div>

  <div class="content">
    <svg class="cat-illustration" viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg">
      <!-- Shadow under box -->
      <ellipse cx="100" cy="200" rx="52" ry="7" fill="rgba(0,0,0,0.08)"/>

      <!-- Box sides -->
      <polygon points="45,185 20,170 20,125 45,140" fill="#a06840"/>
      <polygon points="155,185 180,170 180,125 155,140" fill="#a06840"/>
      <!-- Box body front -->
      <rect x="45" y="140" width="110" height="55" rx="3" fill="#b5784a"/>
      <!-- Box open top flaps -->
      <polygon points="45,140 45,120 90,115 90,135" fill="#c98a56"/>
      <polygon points="155,140 155,120 110,115 110,135" fill="#c98a56"/>
      <!-- Box rim highlight -->
      <rect x="45" y="136" width="110" height="8" rx="2" fill="#d4956a"/>

      <!-- Cat body inside box (partially hidden) -->
      <ellipse cx="100" cy="138" rx="38" ry="18" fill="#e8922a"/>

      <!-- Tail (wags) -->
      <g class="cat-tail" transform="translate(148, 138)">
        <path d="M0 0 Q18 -10 22 -22 Q26 -34 18 -38" stroke="#e8922a" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M0 0 Q18 -10 22 -22 Q26 -34 18 -38" stroke="#d07820" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
      </g>

      <!-- Cat head -->
      <ellipse cx="100" cy="95" rx="40" ry="36" fill="#e8922a"/>

      <!-- Fur stripes on forehead -->
      <path d="M90 68 Q93 62 96 68" stroke="#c97018" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M104 68 Q107 62 110 68" stroke="#c97018" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M97 65 Q100 59 103 65" stroke="#c97018" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Ears -->
      <polygon points="68,70 58,42 84,62" fill="#e8922a"/>
      <polygon points="132,70 142,42 116,62" fill="#e8922a"/>
      <polygon points="70,67 62,46 82,61" fill="#f5c4a8"/>
      <polygon points="130,67 138,46 118,61" fill="#f5c4a8"/>

      <!-- Eyes whites -->
      <ellipse cx="85" cy="93" rx="14" ry="15" fill="white"/>
      <ellipse cx="115" cy="93" rx="14" ry="15" fill="white"/>
      <!-- Pupils -->
      <ellipse cx="85" cy="95" rx="9" ry="10" fill="#1a1a1a"/>
      <ellipse cx="115" cy="95" rx="9" ry="10" fill="#1a1a1a"/>
      <!-- Shine -->
      <circle cx="81" cy="90" r="3" fill="white"/>
      <circle cx="111" cy="90" r="3" fill="white"/>
      <!-- Eye outlines -->
      <ellipse cx="85" cy="93" rx="14" ry="15" fill="none" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="115" cy="93" rx="14" ry="15" fill="none" stroke="#222" stroke-width="1.5"/>

      <!-- Blinking eyelids (overlay same shape) -->
      <ellipse class="eye-lid" cx="85" cy="93" rx="14" ry="15" fill="#e8922a"/>
      <ellipse class="eye-lid" cx="115" cy="93" rx="14" ry="15" fill="#e8922a"/>

      <!-- Nose -->
      <ellipse cx="100" cy="107" rx="4.5" ry="3.5" fill="#d05858"/>
      <!-- Mouth -->
      <path d="M95 111 Q100 116 105 111" stroke="#555" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Philtrum -->
      <line x1="100" y1="110" x2="100" y2="111" stroke="#555" stroke-width="1.5"/>

      <!-- Whiskers left -->
      <line x1="56" y1="105" x2="84" y2="108" stroke="#888" stroke-width="1.2" opacity="0.8"/>
      <line x1="54" y1="111" x2="84" y2="111" stroke="#888" stroke-width="1.2" opacity="0.8"/>
      <line x1="58" y1="117" x2="84" y2="113" stroke="#888" stroke-width="1.2" opacity="0.8"/>
      <!-- Whiskers right -->
      <line x1="144" y1="105" x2="116" y2="108" stroke="#888" stroke-width="1.2" opacity="0.8"/>
      <line x1="146" y1="111" x2="116" y2="111" stroke="#888" stroke-width="1.2" opacity="0.8"/>
      <line x1="142" y1="117" x2="116" y2="113" stroke="#888" stroke-width="1.2" opacity="0.8"/>

      <!-- Paws on box rim -->
      <ellipse cx="76" cy="136" rx="15" ry="10" fill="#e8922a"/>
      <ellipse cx="124" cy="136" rx="15" ry="10" fill="#e8922a"/>
      <!-- Paw toe lines -->
      <path d="M68 138 Q72 141 76 138 Q80 141 84 138" stroke="#c97018" stroke-width="1.5" fill="none"/>
      <path d="M116 138 Q120 141 124 138 Q128 141 132 138" stroke="#c97018" stroke-width="1.5" fill="none"/>
    </svg>

    <h1>You're offline.</h1>
    <p class="subtitle">Some features unavailable.</p>
    <button class="btn-try">Try Again</button>
    <button class="btn-close">Close</button>
  </div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
